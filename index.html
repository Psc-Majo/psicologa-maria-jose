<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psicóloga María José Granda</title>

  <meta name="description" content="Psicóloga María José Granda. Terapia infantil, ansiedad y depresión. Atención a domicilio y online.">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #F7F6E5;
      color: #333;
    }

    header {
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
      url('https://images.unsplash.com/photo-1588776814546-ec7e6c1a4a35');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 120px 20px;
      animation: fadeIn 1.2s ease;
    }

    header img { width: 110px; margin-bottom: 20px; }

    h1 { font-size: 42px; margin: 0; }

    p { line-height: 1.6; }

    .btn {
      display: inline-block;
      margin-top: 20px;
      background: #696FC7;
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #555bc0;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* EFECTO PARA CELULAR */
    .btn:active {
      transform: scale(0.96);
    }

    section {
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease;
    }

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    h2 {
      text-align: center;
      color: #696FC7;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
</html>
