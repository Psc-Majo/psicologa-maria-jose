<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#696FC7"></stop>
      <stop offset="100%" stop-color="#8A90E0"></stop>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="500" fill="url(#bg)"></rect>

  <!-- Formas elegantes -->
  <circle cx="950" cy="120" r="180" fill="#ffffff" opacity="0.05"></circle>
  <circle cx="200" cy="450" r="220" fill="#ffffff" opacity="0.04"></circle>

  <!-- Línea decorativa -->
  <rect x="100" y="250" width="80" height="3" fill="#ffffff" opacity="0.6"></rect>

</svg>